name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push supersedes a build that is still running
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: windows-app
        run: npm ci

      - name: Build Bluey.exe
        working-directory: windows-app
        run: npx electron-builder --win --publish never

      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: bluey-windows
          path: |
            windows-app/dist/*.exe
          if-no-files-found: error

      # Half the size of the combined artifact (installer only, no portable exe): much easier to download
      # on a slow or flaky connection, where a 150 MB transfer can drop before it finishes.
      - name: Upload installer only (smaller download)
        uses: actions/upload-artifact@v4
        with:
          name: bluey-windows-installer
          path: windows-app/dist/Bluey Setup *.exe
          compression-level: 0
          if-no-files-found: error
