<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="overlay.css">
  <title>bluey</title>
</head>
<body>
  <!-- character -->
  <div id="bluey" class="mood-happy">
    <div id="bubble" class="hidden"><span id="bubble-text"></span><div class="tail"></div></div>
    <div id="body">
      <div id="glow"></div>
      <svg id="berry" viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
          <radialGradient id="skin" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#7f9bff"/>
            <stop offset="45%" stop-color="#5470e8"/>
            <stop offset="100%" stop-color="#2c3f9e"/>
          </radialGradient>
          <radialGradient id="shine" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- calyx (little stem star) -->
        <g id="calyx" transform="translate(100,26)">
          <path d="M -12 4 Q 0 -10 12 4 Q 6 1 0 3 Q -6 1 -12 4 Z" fill="#1d2a63"/>
          <rect x="-2.5" y="-9" width="5" height="9" rx="2.5" fill="#2e7d4f"/>
          <ellipse cx="7" cy="-8" rx="7" ry="3.4" fill="#3f9d63" transform="rotate(-24 7 -8)"/>
        </g>
        <circle cx="100" cy="108" r="84" fill="url(#skin)"/>
        <ellipse cx="72" cy="66" rx="30" ry="18" fill="url(#shine)" transform="rotate(-18 72 66)"/>
        <!-- eyes -->
        <g id="eyeL" transform="translate(74,100)">
          <ellipse class="white" cx="0" cy="0" rx="26" ry="30" fill="#ffffff"/>
          <g class="pupil">
            <circle cx="0" cy="0" r="12.5" fill="#101528"/>
            <circle class="spark" cx="4" cy="-4.5" r="4.2" fill="#ffffff" opacity="0.95"/>
          </g>
        </g>
        <g id="eyeR" transform="translate(130,100)">
          <ellipse class="white" cx="0" cy="0" rx="26" ry="30" fill="#ffffff"/>
          <g class="pupil">
            <circle cx="0" cy="0" r="12.5" fill="#101528"/>
            <circle class="spark" cx="4" cy="-4.5" r="4.2" fill="#ffffff" opacity="0.95"/>
          </g>
        </g>
        <!-- mouth -->
        <path id="mouth" d="M 86 148 Q 102 160 118 148" stroke="#101528" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- blush -->
        <ellipse cx="56" cy="136" rx="10" ry="6" fill="#3247a8" opacity="0.55"/>
        <ellipse cx="148" cy="136" rx="10" ry="6" fill="#3247a8" opacity="0.55"/>
        <!-- zzz for sleep -->
        <g id="zzz" class="hidden">
          <text x="152" y="52" font-size="22" fill="#cfe0ff" font-family="Segoe UI, sans-serif" font-weight="700">z</text>
          <text x="168" y="34" font-size="16" fill="#cfe0ff" font-family="Segoe UI, sans-serif" font-weight="700">z</text>
          <text x="180" y="20" font-size="11" fill="#cfe0ff" font-family="Segoe UI, sans-serif" font-weight="700">z</text>
        </g>
      </svg>
      <!-- listening waves -->
      <div id="waves" class="hidden">
        <span></span><span></span><span></span>
      </div>
      <!-- feet -->
      <div class="foot foot-l"></div>
      <div class="foot foot-r"></div>
    </div>
  </div>

  <!-- Bluey's own pointing cursor -->
  <div id="pointer" class="hidden">
    <svg viewBox="0 0 24 24" width="34" height="34">
      <path d="M5 2 L5 20 L10 15.5 L13.2 22 L16.4 20.4 L13.2 14 L20 13.5 Z"
            fill="#ffffff" stroke="#2c3f9e" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>

  <script src="character.js"></script>
</body>
</html>
